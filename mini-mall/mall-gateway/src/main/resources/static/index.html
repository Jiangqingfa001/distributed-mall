<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微商订单管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; background: #f0f2f5; color: #333; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 24px; }
        .header .status { font-size: 14px; padding: 6px 16px; border-radius: 20px; background: rgba(255,255,255,0.2); }
        .header .status.online { background: #52c41a; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .current-user { font-size: 14px; padding: 6px 14px; border-radius: 20px; background: rgba(255,255,255,0.2); color: #fff; }
        .header-btn { background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.55); padding: 6px 16px; border-radius: 20px; font-size: 14px; cursor: pointer; transition: all 0.3s; }
        .header-btn:hover { background: rgba(255,255,255,0.35); }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 24px; }
        .card.full { grid-column: 1 / -1; }
        .card h3 { font-size: 18px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #667eea; color: #333; }
        .form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; flex: 1; min-width: 120px; }
        .form-group label { font-size: 13px; color: #666; margin-bottom: 4px; font-weight: 500; }
        .form-group input { padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #667eea; }
        .btn { padding: 10px 24px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 500; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-outline { background: #fff; color: #667eea; border: 1px solid #667eea; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .btn-warn { background: #ff4d4f; color: #fff; padding: 5px 12px; font-size: 12px; border: none; border-radius: 6px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        table th { background: #fafafa; padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #e8e8e8; }
        table td { padding: 12px; border-bottom: 1px solid #f0f0f0; }
        .tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
        .tag-success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
        .tag-warning { background: #fffbe6; color: #faad14; border: 1px solid #ffe58f; }
        .msg { padding: 10px 16px; border-radius: 8px; margin-top: 12px; font-size: 14px; display: none; }
        .msg.success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; display: block; }
        .msg.error { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; display: block; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .product-item { border: 1px solid #e8e8e8; border-radius: 8px; padding: 12px; cursor: pointer; transition: all 0.3s; }
        .product-item:hover { border-color: #667eea; box-shadow: 0 2px 8px rgba(102,126,234,0.15); }
        .product-item.selected { border-color: #667eea; background: #f0f0ff; }
        .product-item .name { font-weight: 600; font-size: 15px; }
        .product-item .price { color: #ff4d4f; font-size: 18px; font-weight: 700; margin: 6px 0; }
        .product-item .stock { color: #999; font-size: 12px; }
        .summary { display: flex; gap: 20px; margin-bottom: 16px; }
        .summary-item { flex: 1; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 16px; border-radius: 10px; text-align: center; }
        .summary-item .num { font-size: 28px; font-weight: 700; }
        .summary-item .label { font-size: 13px; opacity: 0.9; margin-top: 4px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.45); z-index: 100; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-box { background: #fff; border-radius: 12px; width: 480px; max-width: 92vw; max-height: 80vh; display: flex; flex-direction: column; }
        .modal-head { padding: 16px 20px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
        .modal-head h3 { font-size: 16px; }
        .modal-head .close { cursor: pointer; font-size: 22px; color: #999; }
        .modal-body { padding: 20px; overflow-y: auto; }
        .chat-list { height: 300px; overflow-y: auto; margin-bottom: 12px; }
        .chat-msg { margin-bottom: 10px; display: flex; }
        .chat-msg.mine { justify-content: flex-end; }
        .chat-msg .bubble { max-width: 70%; padding: 8px 12px; border-radius: 10px; font-size: 14px; background: #f0f0f0; }
        .chat-msg.mine .bubble { background: #667eea; color: #fff; }
        .chat-msg .time { font-size: 11px; color: #999; margin-top: 2px; }
        .chat-input-row { display: flex; gap: 8px; }
        .chat-input-row input { flex: 1; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 8px; }
        textarea { width: 100%; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 14px; min-height: 70px; resize: vertical; }
    </style>
</head>
<body>
    <div class="header">
        <h1>微商订单管理系统</h1>
        <div class="header-right">
            <span class="current-user" id="currentUser">未登录</span>
            <button class="header-btn" onclick="switchAccount()">切换账号</button>
            <button class="header-btn" onclick="logout()">退出账号</button>
            <div class="status" id="serverStatus">检查连接中...</div>
        </div>
    </div>

    <div class="container">
        <div class="card full">
            <h3>数据概览</h3>
            <div class="summary">
                <div class="summary-item"><div class="num" id="totalOrders">-</div><div class="label">我的订单数</div></div>
                <div class="summary-item" style="background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%);"><div class="num" id="totalProducts">-</div><div class="label">在售商品</div></div>
            </div>
        </div>

        <div class="card">
            <h3>创建订单</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>商品ID</label>
                    <input type="number" id="productId" placeholder="点击下方商品选择" min="1">
                </div>
                <div class="form-group">
                    <label>数量</label>
                    <input type="number" id="quantity" placeholder="数量" min="1" value="1">
                </div>
                <div class="form-group" style="justify-content:flex-end;">
                    <button class="btn btn-primary" onclick="openAddressModal()">下单</button>
                </div>
            </div>
            <div class="msg" id="createMsg"></div>
        </div>

        <div class="card">
            <h3>商品列表 <button class="btn btn-sm btn-outline" onclick="loadProducts()" style="margin-left:12px;">刷新</button></h3>
            <div class="product-grid" id="productList"><div class="loading">加载中...</div></div>
        </div>

        <div class="card full">
            <h3>我的订单 <button class="btn btn-sm btn-outline" onclick="loadMyOrders()" style="margin-left:12px;">刷新</button></h3>
            <div id="orderTable"><div class="loading">加载中...</div></div>
        </div>
    </div>

    <!-- 地址弹窗 -->
    <div class="modal" id="addressModal">
        <div class="modal-box">
            <div class="modal-head">
                <h3>填写收货地址</h3>
                <span class="close" onclick="closeAddressModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group" style="margin-bottom:12px;">
                    <label>收货地址</label>
                    <textarea id="addressInput" placeholder="请输入详细收货地址（收货人、电话、地址）"></textarea>
                </div>
                <button class="btn btn-primary" style="width:100%;" onclick="confirmOrder()">确认下单</button>
                <div class="msg" id="addressMsg"></div>
            </div>
        </div>
    </div>

    <!-- 私聊弹窗 -->
    <div class="modal" id="chatModal">
        <div class="modal-box">
            <div class="modal-head">
                <h3>与商家对话</h3>
                <span class="close" onclick="closeChat()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="chat-list" id="chatList"><div class="loading">加载中...</div></div>
                <div class="chat-input-row">
                    <input type="text" id="chatInput" placeholder="输入消息...">
                    <button class="btn btn-primary" onclick="sendMessage()">发送</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        var me = null;

        function getCurrentUser() {
            var raw = localStorage.getItem('currentUser');
            if (raw) {
                try { return JSON.parse(raw); } catch (e) { return null; }
            }
            return null;
        }

        function showMsg(id, text, type) {
            var el = document.getElementById(id);
            el.textContent = text;
            el.className = 'msg ' + type;
            setTimeout(function() { el.className = 'msg'; }, 3000);
        }

        function api(path, options) {
            return fetch(path, options).then(function(res) {
                return res.json();
            }).catch(function(e) {
                return { code: 1, message: '请求失败: ' + e.message };
            });
        }

        function initUser() {
            me = getCurrentUser();
            if (!me || !me.id) {
                window.location.href = '/login.html';
                return;
            }
            if (me.role === 'ADMIN') {
                window.location.href = '/admin.html';
                return;
            }
            document.getElementById('currentUser').textContent = '当前账号: ' + (me.phone || me.username || me.id);
        }

        function checkServer() {
            fetch('/api/product/listOnSale').then(function(res) {
                var el = document.getElementById('serverStatus');
                if (res.ok) {
                    el.textContent = '服务在线';
                    el.className = 'status online';
                } else {
                    el.textContent = '服务异常';
                }
            }).catch(function() {
                document.getElementById('serverStatus').textContent = '服务离线';
            });
        }

        function loadProducts() {
            var el = document.getElementById('productList');
            api('/api/product/listOnSale').then(function(data) {
                if (data.code) { el.innerHTML = '<div class="loading">加载失败</div>'; return; }
                document.getElementById('totalProducts').textContent = data.length;
                el.innerHTML = data.map(function(p) {
                    return '<div class="product-item" onclick="selectProduct(' + p.id + ')" id="prod-' + p.id + '">' +
                        '<div class="name">' + p.name + ' <span style="color:#999;font-size:12px;">ID: ' + p.id + '</span></div>' +
                        '<div class="price">¥' + p.price + '</div>' +
                        '<div class="stock">库存: ' + p.stock + '</div>' +
                    '</div>';
                }).join('');
            }).catch(function() {
                el.innerHTML = '<div class="loading" style="color:#ff4d4f;">加载失败</div>';
            });
        }

        function selectProduct(id) {
            var items = document.querySelectorAll('.product-item');
            for (var i = 0; i < items.length; i++) { items[i].classList.remove('selected'); }
            var el = document.getElementById('prod-' + id);
            if (el) el.classList.add('selected');
            document.getElementById('productId').value = id;
        }

        function openAddressModal() {
            var productId = document.getElementById('productId').value;
            var quantity = document.getElementById('quantity').value;
            if (!productId || !quantity || quantity < 1) {
                showMsg('createMsg', '请先选择商品并填写数量', 'error');
                return;
            }
            document.getElementById('addressModal').classList.add('active');
        }

        function closeAddressModal() {
            document.getElementById('addressModal').classList.remove('active');
        }

        function confirmOrder() {
            var address = document.getElementById('addressInput').value.trim();
            var productId = document.getElementById('productId').value;
            var quantity = document.getElementById('quantity').value;
            if (!address) { showMsg('addressMsg', '请填写收货地址', 'error'); return; }

            var params = new URLSearchParams({
                userId: me.id, productId: productId, quantity: quantity, address: address
            });
            fetch('/api/order/create?' + params.toString(), { method: 'POST' }).then(function(res) {
                return res.json();
            }).then(function(data) {
                if (data.message && data.message.indexOf('RPC') >= 0) {
                    showMsg('addressMsg', data.message, 'error');
                    return;
                }
                closeAddressModal();
                document.getElementById('addressInput').value = '';
                showMsg('createMsg', '下单成功! 订单ID: ' + data.id + ', 金额: ¥' + data.totalPrice, 'success');
                loadMyOrders();
                loadProducts();
            }).catch(function(e) {
                showMsg('addressMsg', '下单失败: ' + e.message, 'error');
            });
        }

        function loadMyOrders() {
            var el = document.getElementById('orderTable');
            api('/api/order/user/' + me.id).then(function(data) {
                if (data.code) { el.innerHTML = '<div class="loading">加载失败</div>'; return; }
                document.getElementById('totalOrders').textContent = data.length;
                renderOrderTable(data);
            }).catch(function() {
                el.innerHTML = '<div class="loading" style="color:#ff4d4f;">加载失败</div>';
            });
        }

        function isOverTwoHours(createTime) {
            if (!createTime) return false;
            var t = new Date(createTime.replace(' ', 'T')).getTime();
            return (Date.now() - t) > 2 * 3600 * 1000;
        }

        function renderOrderTable(orders) {
            var el = document.getElementById('orderTable');
            if (!orders || orders.length === 0) {
                el.innerHTML = '<div class="loading">暂无订单</div>';
                return;
            }
            var html = '<table><tr><th>订单ID</th><th>商品ID</th><th>数量</th><th>总金额</th><th>地址</th><th>状态</th><th>下单时间</th><th>操作</th></tr>';
            for (var i = 0; i < orders.length; i++) {
                var o = orders[i];
                var shipped = o.status === '已发货';
                var statusHtml = shipped
                    ? '<span class="tag tag-success">已发货</span>'
                    : '<span class="tag tag-warning">待发货</span>';
                var urgeHtml = '';
                if (!shipped && isOverTwoHours(o.createTime)) {
                    urgeHtml = '<button class="btn-warn" onclick="openChat(true)">催促发货</button>';
                }
                html += '<tr>' +
                    '<td>' + o.id + '</td>' +
                    '<td>' + o.productId + '</td>' +
                    '<td>' + o.quantity + '</td>' +
                    '<td style="color:#ff4d4f;font-weight:600;">¥' + o.totalPrice + '</td>' +
                    '<td>' + (o.address || '-') + '</td>' +
                    '<td>' + statusHtml + '</td>' +
                    '<td>' + (o.createTime || '-') + '</td>' +
                    '<td><button class="btn btn-sm btn-outline" onclick="openChat(false)">联系商家</button> ' + urgeHtml + '</td>' +
                '</tr>';
            }
            html += '</table>';
            el.innerHTML = html;
        }

        var chatTimer = null;

        function openChat(urge) {
            document.getElementById('chatModal').classList.add('active');
            if (urge) {
                document.getElementById('chatInput').value = '请尽快发货，谢谢！';
            }
            loadConversation();
            if (chatTimer) clearInterval(chatTimer);
            chatTimer = setInterval(loadConversation, 3000);
        }

        function closeChat() {
            document.getElementById('chatModal').classList.remove('active');
            if (chatTimer) { clearInterval(chatTimer); chatTimer = null; }
        }

        function loadConversation() {
            api('/api/message/conversation?userIdA=' + me.id + '&userIdB=0').then(function(data) {
                var el = document.getElementById('chatList');
                if (data.code) return;
                if (!data.length) { el.innerHTML = '<div class="loading">暂无消息，快来和商家聊聊吧</div>'; return; }
                el.innerHTML = data.map(function(m) {
                    var mine = m.fromUserId === me.id;
                    return '<div class="chat-msg ' + (mine ? 'mine' : '') + '">' +
                        '<div><div class="bubble">' + m.content + '</div>' +
                        '<div class="time">' + (m.createTime || '') + '</div></div>' +
                    '</div>';
                }).join('');
                el.scrollTop = el.scrollHeight;
            });
        }

        function sendMessage() {
            var content = document.getElementById('chatInput').value.trim();
            if (!content) return;
            var params = new URLSearchParams({ fromUserId: me.id, toUserId: 0, content: content });
            fetch('/api/message/send', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: params.toString() })
            .then(function(res) { return res.json(); })
            .then(function() {
                document.getElementById('chatInput').value = '';
                loadConversation();
            });
        }

        function switchAccount() {
            window.location.href = '/login.html';
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/login.html';
        }

        initUser();
        checkServer();
        loadProducts();
        loadMyOrders();
    </script>
</body>
</html>
